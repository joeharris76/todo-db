[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "todo-db"
version = "0.4.3"
description = "A project-isolated database-backed TODO tracker"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "tomli>=2; python_version < '3.11'",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
todo-db = "todo_db.cli:main"
todo = "todo_db.cli:main"

[project.optional-dependencies]
hosted = [
    "libsql>=0.1.11",
]
audit = [
    "cryptography>=42",
]
legacy = [
    "pyyaml>=6",
]
findings = [
    "pyyaml>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/todo_db"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "cryptography>=49.0.0",
    "libsql>=0.1.11",
    "pytest>=9.1.1",
    "pyyaml>=6",
    "ruff>=0.15.22",
    "tomli>=2; python_version < '3.11'",
]
