# todo-db's skills. See https://github.com/joeharris76/skill-sync for the format.
#
# skill-sync never fetches: `source` must be a local checkout. Point these at
# wherever the catalog and product repositories are cloned.
#
# To ship a catalog edit, commit it in skill-sync-skills and bump `rev` below.
# To ship a todo-db skill edit, commit it here; `rev` for the local source
# pins the commit the payload comes from.

target = .claude/skills
target = .codex/skills
target = .gemini/skills

source = ~/Developer/skill-sync-skills
rev    = c63378624588e19bef9698078d925161ff4e45c5
dir    = skills
skill  = code
skill  = docs
skill  = shared-agent-execution
skill  = shared-change-framework
skill  = shared-investigation-framework
skill  = shared-review-protocol
skill  = test
skill  = tidy-perms

# Operator skill owned by the product repository.
source = ~/Developer/skill-sync
rev    = 25e1e47693d8b0b2aba91d3ad3dbc0c14b8d3c4c
dir    = skills
skill  = skill-sync

# Project-owned skill. `rev` pins the commit this payload is exported from;
# bump it when skills/todo-db changes.
source = .
rev    = 7a8ab31bc51f8672d081123d669e9aed914f112d
dir    = skills
skill  = todo-db
