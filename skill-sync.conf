# todo-db's skills. See https://github.com/joeharris76/skill-sync for the format.
#
# skill-sync never fetches: `source` must be a local checkout. Point these at
# wherever the catalog and product repositories are cloned.
#
# To ship a catalog edit, commit it in skill-sync-skills and bump `rev` below.

target = .claude/skills
target = .codex/skills
target = .gemini/skills

