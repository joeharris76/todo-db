name: Publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v5
        with: {python-version: "3.12"}
      - name: Validate version matches tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            PKG_VERSION="$(grep -E '^version = ' pyproject.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')"
            TAG_VERSION="${TAG#v}"
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then echo "::error::Tag $TAG != $PKG_VERSION"; exit 1; fi
          fi
          echo Tag ok
      - name: Build sdist and wheel
        run: uv build
      - name: Check distributions
        run: ls -lh dist/ && uv run --with build python -c "import pathlib; assert list(pathlib.Path('dist').glob('*.whl'))"
      - name: Generate checksums
        run: (cd dist && sha256sum * > SHA256SUMS) && cat dist/SHA256SUMS
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with: {name: dist, path: "dist/*", retention-days: 7}
  github-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist}
      - uses: softprops/action-gh-release@v2
        with: {files: "dist/*", generate_release_notes: true, fail_on_unmatched_files: true}
  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: {name: pypi, url: https://pypi.org/p/todo-db}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: {packages-dir: dist, verbose: true, print-hash: true}
