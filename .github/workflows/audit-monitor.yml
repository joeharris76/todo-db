name: State Branch Operational Monitor

# Operational state monitor. Run on demand or configure schedule in private ops runner.
on:
  workflow_dispatch:
    inputs:
      state_remote:
        description: "State remote URL to validate"
        required: false
        default: ""

jobs:
  verify-state:
    name: State Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run State Validation
        env:
          TODO_DB_STATE_REMOTE: ${{ secrets.TODO_DB_STATE_REMOTE }}
          TODO_DB_STATE_BRANCH: ${{ secrets.TODO_DB_STATE_BRANCH }}
          TARGET_INPUT: ${{ github.event.inputs.state_remote }}
        run: |
          TARGET="${TARGET_INPUT:-${TODO_DB_STATE_REMOTE}}"
          if [ -z "$TARGET" ]; then
            echo "::warning::No state remote specified and TODO_DB_STATE_REMOTE secret is not configured; skipping state monitor."
            exit 0
          fi
          echo "Validating state branch: $TARGET"
          uv run todo-db validate --state-remote "$TARGET" > /tmp/state-validation.json
          cat /tmp/state-validation.json
          uv run todo-db recover --state-remote "$TARGET" --limit 5

      - name: Upload State Validation Summary
        if: success() && hashFiles('/tmp/state-validation.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: state-validation-summary
          path: /tmp/state-validation.json
          retention-days: 14

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::State validation failed! Check the state remote and branch for corruption or invalid snapshots."
