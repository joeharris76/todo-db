name: CI

on:
  push:
    branches: [main, develop, "feat/**", "fix/**", "codex/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync (all extras + dev group)
        run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q
      - name: Build artifacts
        run: uv build

      - name: CLI smoke (bootstrap/validate/list on a scratch state branch)
        run: |
          git init --quiet --bare /tmp/ci-state.git
          uv run todo-db bootstrap --state-remote /tmp/ci-state.git --state-branch todo-state
          uv run todo-db validate --state-remote /tmp/ci-state.git --state-branch todo-state
          uv run todo-db list --state-remote /tmp/ci-state.git --state-branch todo-state

      # Integrity gate: proves the committed skill mirrors under
      # .claude/.codex/.gemini match skill-sync.lock. It reads no skill source,
      # so it cannot be broken by an upstream catalog moving; the tool itself
      # is pinned by commit so CI does not execute a moving target.
      # Clone + build rather than `npx github:…#<sha>`: that form hits
      # npm/cli#6723 (`GitFetcher requires an Arborist constructor`) on the
      # Ubuntu runner's bundled npm.
      - name: Skill mirrors match the lock
        env:
          SKILL_SYNC_SHA: 6bca368c35ce0db26ffdb314e25094a70ae9dd43
        run: |
          git clone --filter=blob:none https://github.com/joeharris76/skill-sync.git "$RUNNER_TEMP/skill-sync"
          git -C "$RUNNER_TEMP/skill-sync" checkout --detach "$SKILL_SYNC_SHA"
          npm --prefix "$RUNNER_TEMP/skill-sync" install --ignore-scripts
          npm --prefix "$RUNNER_TEMP/skill-sync" run build
          node "$RUNNER_TEMP/skill-sync/dist/cli/index.js" verify

