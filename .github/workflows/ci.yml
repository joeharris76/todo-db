name: CI

on:
  push:
    branches: [main, develop, "feat/**", "fix/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync (all extras + dev group)
        run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q
      - name: Build artifacts
        run: uv build

      - name: Validate acceptance harness syntax
        run: |
          bash -n scripts/turso_acceptance.sh
          bash -n scripts/hosted_auth_acceptance.sh
          python -m py_compile scripts/parity_conformance.py

      - name: Parity conformance (CLI help, exit codes, tracker+findings DDL)
        run: uv run python scripts/parity_conformance.py --check

      # Integrity gate: proves the committed skill mirrors under
      # .claude/.codex/.gemini are exactly what skill-sync wrote, checked
      # against each target's skill-sync.manifest. It reads no skill source,
      # so it cannot be broken by an upstream catalog moving; the tool itself
      # is pinned by commit so CI does not execute a moving target. The
      # wrapper is a shell script, so there is no build step: check out the
      # pinned revision and run it directly.
      - name: Skill mirrors match the manifest
        env:
          SKILL_SYNC_SHA: 25e1e47693d8b0b2aba91d3ad3dbc0c14b8d3c4c
        run: |
          git clone --filter=blob:none https://github.com/joeharris76/skill-sync.git "$RUNNER_TEMP/skill-sync"
          git -C "$RUNNER_TEMP/skill-sync" checkout --detach "$SKILL_SYNC_SHA"
          sh "$RUNNER_TEMP/skill-sync/bin/skill-sync" verify

      # The hosted run stays out of CI on purpose: CI injects credentials into
      # the environment, which is the condition that hid the v0.4.2 failure.
      # Only the skip contract is asserted here.
      - name: Hosted auth harness skips rather than silently passing
        run: |
          # The runner shell is `bash -e`, so capture the status explicitly:
          # a bare `cmd; test $? -eq 77` aborts on the skip before asserting.
          set +e
          env -u TODO_DB_URL -u TODO_DB_ACCEPTANCE_URL -u TODO_DB_AUTH_TOKEN \
              -u TODO_DB_RO_AUTH_TOKEN -u TODO_DB_CREDENTIAL_COMMAND \
            bash scripts/hosted_auth_acceptance.sh
          status=$?
          set -e
          test "$status" -eq 77

